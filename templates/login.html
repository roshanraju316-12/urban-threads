{% extends "base.html" %}
{% block title %}Log in — URBAN THREADS{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-intro"><p class="eyebrow">WELCOME BACK</p><h1>Your style,<br><em>your space.</em></h1><p>Log in to continue shopping and keep track of your orders.</p></div>
<form class="form-card" method="post"><h2>Log in</h2><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button button-dark full-width">Log in</button><p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p></form></section>
{% endblock %}
