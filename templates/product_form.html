{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'Add' }} product — URBAN THREADS{% endblock %}
{% block content %}
<section class="page-shell narrow-shell"><p class="eyebrow">STORE MANAGEMENT</p><h1 class="page-title">{{ 'Edit product' if product else 'Add a product' }}<span>.</span></h1>
<form class="form-card admin-product-form" method="post"><label>Product name<input name="name" required maxlength="120" value="{{ product.name if product else '' }}"></label><label>Category<input name="category" required maxlength="60" placeholder="T-Shirts, Shirts, Jeans..." value="{{ product.category if product else '' }}"></label><label>Description<textarea name="description" rows="4">{{ product.description if product else '' }}</textarea></label><label>Price (₹)<input type="number" name="price" min="0" step="0.01" required value="{{ product.price if product else '' }}"></label><label>Stock quantity<input type="number" name="stock" min="0" step="1" required value="{{ product.stock if product else 10 }}"></label><label>Image URL <span class="muted">(optional)</span><input type="url" name="image_url" value="{{ product.image_url if product else '' }}" placeholder="https://..."></label><button class="button button-dark full-width">Save product</button><a class="text-link centered" href="{{ url_for('admin_dashboard') }}">Cancel</a></form></section>
{% endblock %}
